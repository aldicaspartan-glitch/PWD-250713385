<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Formulir Pendaftaran Workshop</title>
</head>

<body>

	<h1>Formulir Pendaftaran Workshop</h1>

	<form action="" method="post">

		<h3>Data Peserta</h3>

		<table cellspacing="4" cellpadding="4" border="1"
			style="border-collapse:collapse; width:100%;">

			<tr>
				<td style="width:32%;">
					Nama Lengkap
				</td>
				<td>
					<input type="text" name="nama" />
				</td>
			</tr>

			<tr>
				<td style="width:32%;">
					NIM
				</td>
				<td>
					<input type="text" name="nim" />
				</td>
			</tr>

			<tr>
				<td style="width:32%;">
					Jenis Kelamin
				</td>
				<td>
					<input type="radio" id="laki" name="jk" value="Laki-Laki" />
					<label for="laki">Laki-Laki</label>

					<input type="radio" id="perempuan" name="jk" value="Perempuan" />
					<label for="perempuan">Perempuan</label>
				</td>
			</tr>

			<tr>
				<td style="width:32%;">
					Program Studi
				</td>
				<td>
					<select name="prodi">
						<option>Informatika</option>
						<option>Sistem Informasi</option>
						<option>Teknik Industri</option>
					</select>
				</td>
			</tr>

		</table>

		<br />

		<h3>Pilihan Workshop</h3>

		<table cellspacing="4" cellpadding="4" border="1"
			style="border-collapse:collapse; width:100%;">

			<tr>
				<td style="width:32%;">
					Jenis Peserta
				</td>
				<td>
					<input type="radio" id="mahasiswa" name="peserta" value="Mahasiswa" />
					<label for="mahasiswa">Mahasiswa</label>

					<input type="radio" id="umum" name="peserta" value="Umum" />
					<label for="umum">Umum</label>
				</td>
			</tr>

			<tr>
				<td style="width:32%; vertical-align:top;">
					Materi Workshop
				</td>
				<td>
					<input type="checkbox" id="uiux" name="materi" value="UI/UX Design" />
					<label for="uiux">UI/UX Design</label>
					<br />

					<input type="checkbox" id="web" name="materi" value="Web Development" />
					<label for="web">Web Development</label>
					<br />

					<input type="checkbox" id="data" name="materi" value="Data Analysis" />
					<label for="data">Data Analysis</label>
				</td>
			</tr>

		</table>

		<br />

		<h3>Informasi Tambahan</h3>

		<table cellspacing="4" cellpadding="4" border="1"
			style="border-collapse:collapse; width:100%;">

			<tr>
				<td style="width:32%;">
					Alasan Mengikuti Workshop
				</td>
				<td>
					<textarea name="alasan" rows="5" cols="30"></textarea>
				</td>
			</tr>

			<tr>
				<td style="width:32%;">
					Jenis Pembayaran
				</td>
				<td>
					<input type="radio" id="qris" name="bayar" value="QRIS" />
					<label for="qris">QRIS</label>

					<input type="radio" id="transfer" name="bayar" value="Transfer Bank" />
					<label for="transfer">Transfer Bank</label>
				</td>
			</tr>

			<tr>
				<td style="width:32%;">
					Bukti Pembayaran
				</td>
				<td>
					<input type="file" name="bukti" />
				</td>
			</tr>

			<tr>
				<td colspan="2" style="text-align:center;">
					<input type="submit" value="Daftar" />
				</td>
			</tr>

		</table>

	</form>

</body>

</html>
``
